<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aniversário da Catarina 🍎</title><style>*{box-sizing:border-box}body{margin:0;background:#fff4e7;font-family:Arial,sans-serif;text-align:center;color:#83121c}.wrap{max-width:520px;margin:auto;padding:8px 8px 22px}.stage{position:relative;width:100%;aspect-ratio:2/3;overflow:hidden;background:#60554e}.stage video,.stage .shot{position:absolute;left:12.1%;top:10.6%;width:75.8%;height:54%;object-fit:cover}.stage .shot{display:none}.stage .decor{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.hit{position:absolute;left:20%;width:60%;top:90.6%;height:7%;border:0;background:transparent;cursor:pointer}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}button.action,a.action{background:#b30920;color:white;border:0;border-radius:20px;padding:13px 20px;font-size:16px;font-weight:bold;text-decoration:none;cursor:pointer}.secondary{background:#666!important}#status{min-height:24px;margin:8px;font-size:14px}</style></head><body><main class="wrap"><div class="stage" id="stage"><video id="video" autoplay playsinline muted></video><img class="shot" id="shot" alt="Foto tirada"><img class="decor" src="moldura_catarina.png" alt="Moldura do aniversário da Catarina"><button class="hit" id="capture" aria-label="Tirar foto"></button></div><p id="status">Permita o uso da câmera para tirar sua foto.</p><div class="controls"><button class="action" id="start">Abrir câmera</button><button class="action secondary" id="flip" hidden>Virar câmera</button><a class="action" id="download" download="lembranca-catarina.png" hidden>Baixar minha foto</a><button class="action secondary" id="again" hidden>Nova foto</button></div></main><script>const video=document.getElementById('video'),shot=document.getElementById('shot'),status=document.getElementById('status'),download=document.getElementById('download'),start=document.getElementById('start'),flip=document.getElementById('flip'),again=document.getElementById('again'),capture=document.getElementById('capture');let stream=null,facing='user';async function camera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:1920}}});video.srcObject=stream;await video.play();shot.style.display='none';video.style.display='block';download.hidden=true;again.hidden=true;flip.hidden=false;start.hidden=true;status.textContent='Câmera pronta! Toque em TIRAR FOTO na moldura.'}catch(e){status.textContent='Não foi possível abrir a câmera. Autorize o acesso no navegador e toque em Abrir câmera.';start.hidden=false}}async function take(){if(!stream||!video.videoWidth){await camera();return}const c=document.createElement('canvas');c.width=1024;c.height=1536;const ctx=c.getContext('2d');const x=124,y=163,w=775,h=830;const vw=video.videoWidth,vh=video.videoHeight;const scale=Math.max(w/vw,h/vh),sw=w/scale,sh=h/scale;ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,18);ctx.clip();if(facing==='user'){ctx.translate(x+w,y);ctx.scale(-1,1);ctx.drawImage(video,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,w,h)}else ctx.drawImage(video,(vw-sw)/2,(vh-sh)/2,sw,sh,x,y,w,h);ctx.restore();const overlay=new Image();overlay.src='moldura.png';await overlay.decode();ctx.drawImage(overlay,0,0,1024,1536);const url=c.toDataURL('image/png');shot.src=url;shot.style.display='block';video.style.display='none';download.href=url;download.hidden=false;again.hidden=false;status.textContent='Sua lembrança está pronta! Toque em Baixar minha foto.'}start.onclick=camera;flip.onclick=()=>{facing=facing==='user'?'environment':'user';camera()};capture.onclick=take;again.onclick=()=>{shot.style.display='none';video.style.display='block';download.hidden=true;again.hidden=true;status.textContent='Toque em TIRAR FOTO na moldura.'};if(navigator.mediaDevices?.getUserMedia)camera();else status.textContent='Abra este site pelo navegador HTTPS de um celular com câmera.';</script></body></html>
