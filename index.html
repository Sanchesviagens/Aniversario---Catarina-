<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aniversário da Catarina 🍎</title><style>body{margin:0;background:#fff7ed;color:#8b1822;font-family:system-ui;text-align:center}main{max-width:480px;margin:auto;padding:14px}h1{font-size:1.5rem;margin:8px}p{margin:6px 0 12px}.stage{position:relative;width:min(90vw,360px);aspect-ratio:9/16;margin:auto;border-radius:20px;overflow:hidden;background:#422b29}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}video{transform:scaleX(-1)}canvas{pointer-events:none}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px}button,a.save{background:#b71d2a;color:white;border:0;border-radius:30px;padding:13px 20px;font-size:1rem;font-weight:700;text-decoration:none}button:disabled{opacity:.5}small{display:block;line-height:1.5}</style></head><body><main><h1>🍎 Aniversário da Catarina 🍎</h1><p>21.11.2026 • 17h</p><div class="stage"><video id="v" autoplay muted playsinline></video><canvas id="overlay" width="1080" height="1920"></canvas></div><div class="actions"><button id="start">Abrir câmera</button><button id="snap" disabled>Tirar foto 📸</button><button id="flip" disabled>Virar câmera</button><a id="save" class="save" hidden download="lembranca-catarina.png">Salvar foto</a></div><small id="msg">Permita o acesso à câmera para começar. Funciona em páginas HTTPS.</small></main><script>
const v=document.getElementById('v'),c=document.getElementById('overlay'),ctx=c.getContext('2d'),msg=document.getElementById('msg'),start=document.getElementById('start'),snap=document.getElementById('snap'),flip=document.getElementById('flip'),save=document.getElementById('save');let stream=null,facing='user';
function apple(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#d52532';ctx.beginPath();ctx.ellipse(-18,0,38,44,-.15,0,Math.PI*2);ctx.ellipse(18,0,38,44,.15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#317d3c';ctx.beginPath();ctx.ellipse(18,-52,30,12,-.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#72412b';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,-35);ctx.lineTo(6,-60);ctx.stroke();ctx.restore()}
function frame(){ctx.clearRect(0,0,1080,1920);ctx.strokeStyle='#fff6e4';ctx.lineWidth=36;ctx.strokeRect(18,18,1044,1884);ctx.strokeStyle='#b91f2d';ctx.lineWidth=17;ctx.strokeRect(46,46,988,1828);ctx.fillStyle='rgba(255,248,229,.94)';ctx.fillRect(64,70,952,195);ctx.fillRect(64,1630,952,215);for(let i=0;i<5;i++){apple(110+i*215,320,1.05);apple(110+i*215,1570,.95)}ctx.textAlign='center';ctx.fillStyle='#a21c29';ctx.font='bold 69px Georgia,serif';ctx.fillText('Aniversário da Catarina',540,174);ctx.font='bold 47px system-ui';ctx.fillText('21.11.2026  •  17h',540,1750);ctx.font='35px system-ui';ctx.fillText('Uma lembrança especial 🍎',540,1805)}frame();
async function openCam(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:facing,width:{ideal:1080},height:{ideal:1920}}});v.srcObject=stream;await v.play();v.style.display='block';c.style.display='block';snap.disabled=false;flip.disabled=false;save.hidden=true;msg.textContent='Posicione-se no centro da moldura e tire a foto!'}catch(e){msg.textContent='Não foi possível abrir a câmera. Verifique a permissão do navegador e se a página está em HTTPS.'}}
start.onclick=openCam;flip.onclick=()=>{facing=facing==='user'?'environment':'user';openCam()};snap.onclick=()=>{if(!v.videoWidth)return;let out=document.createElement('canvas');out.width=1080;out.height=1920;let g=out.getContext('2d');let sw=v.videoWidth,sh=v.videoHeight,scale=Math.max(1080/sw,1920/sh),dw=sw*scale,dh=sh*scale;g.save();if(facing==='user'){g.translate(1080,0);g.scale(-1,1)}g.drawImage(v,(1080-dw)/2,(1920-dh)/2,dw,dh);g.restore();g.drawImage(c,0,0);save.href=out.toDataURL('image/png');save.hidden=false;save.textContent='Baixar minha foto ⬇️';msg.textContent='Sua foto está pronta! Toque em baixar para salvar.'};
</script></body></html>
